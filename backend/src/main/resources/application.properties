spring.application.name=backend

# Server Configuration
server.port=8080

# Database Configuration (H2 in MySQL mode)
spring.datasource.url=jdbc:h2:mem:creatorconnectdb;MODE=MySQL;DATABASE_TO_UPPER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration (Secret must be at least 256 bits/32 bytes)
jwt.secret=9a61421421421421421421421421421421421421421421421421421421421421
jwt.expirationMs=86400000
