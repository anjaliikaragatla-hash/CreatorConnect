services:
  - type: web
    name: creatorconnect-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_JPA_OPEN_IN_VIEW
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://creatorconnect-frontend.vercel.app # Change this to your final Vercel app URL
      - key: JWT_SECRET
        generateValue: true
